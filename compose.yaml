services:
  apache-downloader:
    build:
      context: .
    image: awesome-downloader:latest
    container_name: apache-downloader
    ports:
      - "8080:80"
    environment:
      DOWNLOADER_GIF_MAX_SECONDS: 600
      DOWNLOADER_REENCODE_MAX_SECONDS: 7200
      DOWNLOADER_MAX_BATCH_ITEMS: 20
      DOWNLOADER_PLAYLIST_MAX_ITEMS: 50
      DOWNLOADER_TRANSCRIBER_URL: http://downloader-transcriber:8000
      DOWNLOADER_TRANSCRIBER_SHARED_TEMP_DIR: /work
    depends_on:
      downloader-pot-provider:
        condition: service_healthy
      downloader-transcriber:
        condition: service_healthy
    volumes:
      - ./app:/var/www/html
      - ./temp:/var/www/html/temp
      - ./download:/var/www/html/download
    restart: unless-stopped

  downloader-pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.2-deno@sha256:20bd6ad8561d71c628fb3d4fe35a7fcd2c9ef84eecd2bbf40f77dd0d8a8e3799
    container_name: downloader-pot-provider
    init: true
    cpus: 1
    mem_limit: 512m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "deno", "eval", "const r = await fetch('http://127.0.0.1:4416/'); if (!r.ok) Deno.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  downloader-transcriber:
    build:
      context: ./transcriber
    image: awesome-downloader-transcriber:latest
    container_name: downloader-transcriber
    environment:
      WHISPER_MODEL: small
      WHISPER_COMPUTE_TYPE: int8
      WHISPER_THREADS: 3
      WHISPER_MODEL_CACHE: /models
      TRANSCRIBER_WORK_ROOT: /work/work
    volumes:
      - ./temp:/work
    cpus: 3
    mem_limit: 2500m
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
